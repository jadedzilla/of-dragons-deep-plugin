name: Delete all releases and tags

# Run from the Actions tab and type DELETE to confirm. Deletes every GitHub release (with its tag) and any
# remaining tags. repo.json still points at the deleted downloads afterwards, so run Release (e.g. 1.0.0) next.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to delete every release and tag"
        required: true

permissions:
  contents: write

jobs:
  delete:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete releases (and their tags)
        run: |
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Delete remaining tags
        run: |
          git fetch --tags --force --prune --prune-tags
          for tag in $(git tag); do
            echo "Deleting tag $tag"
            git push --delete origin "$tag"
          done
          echo "Tags left: $(git ls-remote --tags origin | wc -l)"
